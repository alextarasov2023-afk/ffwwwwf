name: Build mod

on:
  push:
    branches: [arena/01a06e22-ffwwwwf]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Fetch jna (обязателен для компиляции)
        run: |
          mkdir -p libs
          curl -fsSL -o libs/jna-5.15.0.jar \
            https://repo.maven.apache.org/maven2/net/java/dev/jna/jna/5.15.0/jna-5.15.0.jar
          ls -la libs/jna-5.15.0.jar

      - name: Fetch baritone (nested jar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          LIST=$(gh api 'repos/cabaletta/baritone/releases?per_page=100' --paginate \
            --jq '.[].assets[].browser_download_url' || echo "")
          echo "$LIST" | head -5 || true

          URL=$(echo "$LIST" | grep -F 'baritone-standalone-fabric-1.13.1.jar' | head -1 || true)
          if [ -z "$URL" ]; then
            URL=$(echo "$LIST" | grep -E 'baritone-standalone-fabric-1\.21(\.4)?\.jar' | head -1 || true)
          fi
          if [ -z "$URL" ]; then
            URL=$(echo "$LIST" | grep -F 'baritone-standalone-fabric' | head -1 || true)
          fi

          if [ -n "$URL" ]; then
            echo "::notice::Baritone: $URL"
            curl -fsSL -o libs/baritone-standalone-fabric-1.13.1.jar "$URL" || true
          fi
          if [ ! -s libs/baritone-standalone-fabric-1.13.1.jar ]; then
            echo "::warning::baritone не найден — пустой jar (сборка без nested baritone)"
            python3 -c "import zipfile; zipfile.ZipFile('libs/baritone-standalone-fabric-1.13.1.jar','w').writestr('README.txt','placeholder')"
          fi

      - name: Fetch nether-pathfinder (shaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIST=$(gh api 'repos/leijurv/Nether-Pathfinder/releases?per_page=100' --paginate \
            --jq '.[].assets[].browser_download_url' || echo "")
          echo "$LIST" | head -5 || true

          URL=$(echo "$LIST" | grep -F 'nether-pathfinder-1.4.1.jar' | head -1 || true)
          if [ -z "$URL" ]; then
            URL=$(echo "$LIST" | grep -E 'nether-pathfinder-1(\.[0-9]+)*\.jar' | head -1 || true)
          fi

          if [ -n "$URL" ]; then
            echo "::notice::NetherPathfinder: $URL"
            curl -fsSL -o libs/nether-pathfinder-1.4.1.jar "$URL" || true
          fi
          if [ ! -s libs/nether-pathfinder-1.4.1.jar ]; then
            echo "::warning::nether-pathfinder не найден — пустой jar"
            python3 -c "import zipfile; zipfile.ZipFile('libs/nether-pathfinder-1.4.1.jar','w').writestr('README.txt','placeholder')"
          fi

      - name: List libs
        run: ls -la libs

      - name: Build (remapJar)
        run: |
          set +e
          gradle remapJar --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G > build.log 2>&1
          CODE=$?
          tail -n 80 build.log
          if [ $CODE -ne 0 ]; then
            # Диагностика: доступные методы классов MC из jar лума (для починки API-имён)
            {
              for j in $(find ~/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null | grep -v sources | grep -v javadoc); do
                if unzip -l "$j" 2>/dev/null | grep -q "GameMessageS2CPacket"; then
                  echo "== $j"
                  javap -cp "$j" net.minecraft.network.packet.s2c.play.GameMessageS2CPacket || true
                  break
                fi
              done
            } > .ci-javap.txt 2>&1 || true
            git config user.name "arena-ai-coding-agent[bot]"
            git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
            mkdir -p .ci
            cp build.log .ci/build-failed.log
            mv .ci-javap.txt .ci/javap.txt || true
            git add .ci || true
            git commit -m "ci: лог неудавшейся сборки [skip ci]" || true
            git push || true
          fi
          exit $CODE

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: wonderful-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish build to Release (постоянная ссылка на jar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build -y --cleanup-tag || true
          gh release create build build/libs/*.jar \
            --title "wonderful — свежая сборка" \
            --notes "Автосборка ветки arena/01a06e22-ffwwwwf. MC 1.21.4, Fabric." \
            --prerelease || true
