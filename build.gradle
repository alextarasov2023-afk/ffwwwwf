plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

configurations {
	shade
}

def baritoneJar = file("libs/baritone-standalone-fabric-1.13.1.jar")
def baritoneApiJar = file("libs/baritone-api-fabric-1.13.1.jar")
def netherPathfinderJar = file("libs/nether-pathfinder-1.4.1.jar")

base {
	archivesName = project.archives_base_name
}

// Windows-специфика (OneDrive/папка mods) применяется только на Windows,
// чтобы проект собирался и на CI/Linux без правок.
def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")

// OneDrive блокирует/тормозит папку build (файлы заняты синхронизацией),
// из-за чего clean/compileJava падают с "Unable to delete directory".
// Выносим папку сборки за пределы OneDrive.
if (isWindows) {
	layout.buildDirectory = file("C:/Users/1/.wonderful-build")
}

repositories {
}

dependencies {
	    minecraft "com.mojang:minecraft:${project.minecraft_version}"
	    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modLocalRuntime files(baritoneJar)
		implementation files(netherPathfinderJar)
		shade files(netherPathfinderJar)
		implementation files("libs/jna-5.15.0.jar")
		shade files("libs/jna-5.15.0.jar")
	    compileOnly 'org.projectlombok:lombok:1.18.44'
	    annotationProcessor 'org.projectlombok:lombok:1.18.44'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

loom {
	accessWidenerPath = file("src/main/resources/wonderful.accesswidener")

	// Loom 1.15+: legacy Mixin AP отключён по умолчанию (useLegacyMixinAp = false),
	// из-за чего refmap не генерируется и в продакшене (intermediary) не находятся
	// цели инъекций: "No refMap loaded ... Scanned 0 target(s)" -> краш при загрузке.
	mixin {
		useLegacyMixinAp = true
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	doFirst {
		if (!baritoneJar.exists()) {
			throw new GradleException("Missing nested Baritone jar: ${baritoneJar}")
		}
		if (!netherPathfinderJar.exists()) {
			throw new GradleException("Missing nether-pathfinder jar: ${netherPathfinderJar}")
		}
	}

	from {
		configurations.shade.collect { dependency ->
			dependency.isDirectory() ? dependency : zipTree(dependency)
		}
	}

	from(baritoneJar) {
		into "META-INF/jars"
	}

	exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Автоматический деплой собранного мода в папку mods Minecraft.
// Иначе легко случайно скопировать в mods устаревший jar из старой папки build
// (без refmap) — что и вызывало краш "No refMap loaded ... Scanned 0 target(s)".
if (isWindows) {
	def minecraftModsDir = file("C:/Users/1/AppData/Roaming/.minecraft/mods")

	tasks.register("deployMod", Copy) {
		dependsOn tasks.named("remapJar")
		from(tasks.named("remapJar"))
		into minecraftModsDir
		doLast {
			println "Deployed ${project.archives_base_name}-${project.version}.jar -> ${minecraftModsDir}"
		}
	}

	tasks.named("build") {
		finalizedBy "deployMod"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
